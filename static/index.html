<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyPortal Support</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 760px;
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e2433;
    }

    .logo { width: 28px; height: 28px; }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    header span {
      margin-left: auto;
      font-size: 12px;
      color: #64748b;
    }

    #messages {
      flex: 1;
      width: 100%;
      max-width: 760px;
      overflow-y: auto;
      padding: 24px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      display: flex;
      gap: 12px;
      animation: fadein 0.15s ease;
    }

    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .msg.agent .avatar { background: #1e3a5f; color: #60a5fa; }
    .msg.user  .avatar { background: #1e293b; color: #94a3b8; }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.agent .bubble {
      background: #1a2035;
      border-bottom-left-radius: 4px;
      color: #cbd5e1;
    }

    .msg.user .bubble {
      background: #1e3a5f;
      border-bottom-right-radius: 4px;
      color: #e2e8f0;
    }

    .escalated-banner {
      background: #451a1a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
      text-align: center;
    }

    .thinking {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 14px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #475569;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    #input-area {
      width: 100%;
      max-width: 760px;
      padding: 12px 24px 24px;
    }

    #input-row {
      display: flex;
      gap: 8px;
      background: #1a2035;
      border: 1px solid #1e2d45;
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s;
    }

    #input-row:focus-within { border-color: #3b82f6; }

    #input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-size: 14px;
      color: #e2e8f0;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 4px 0;
    }

    #input::placeholder { color: #475569; }

    #send {
      background: #2563eb;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
      align-self: flex-end;
    }

    #send:hover { background: #1d4ed8; }
    #send:disabled { background: #1e293b; cursor: not-allowed; }

    #send svg { width: 16px; height: 16px; fill: white; }
  </style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="14" cy="14" r="14" fill="#1e3a5f"/>
    <path d="M8 14a6 6 0 1 1 12 0A6 6 0 0 1 8 14z" fill="#3b82f6" opacity="0.3"/>
    <circle cx="14" cy="14" r="3" fill="#60a5fa"/>
  </svg>
  <h1>SkyPortal Support</h1>
  <span id="status">llama3.2 · local</span>
</header>

<div id="messages"></div>

<div id="input-area">
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Ask a question..."></textarea>
    <button id="send" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const sessionId = crypto.randomUUID();
  let busy = false;

  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'agent' ? 'SP' : 'You';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function addThinking() {
    const msg = document.createElement('div');
    msg.className = 'msg agent';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'SP';

    const bubble = document.createElement('div');
    bubble.className = 'bubble thinking';
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      bubble.appendChild(dot);
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function addEscalatedBanner() {
    const div = document.createElement('div');
    div.className = 'escalated-banner';
    div.textContent = 'This conversation has been handed off to a human agent.';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Initial greeting
  addMessage('agent', 'Hi! I\'m the SkyPortal support agent. How can I help you today?');

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', text);
    const thinking = addThinking();

    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));
        thinking.remove();
        addMessage('agent', data.text);
        if (data.escalated) {
          addEscalatedBanner();
          sendBtn.disabled = true;
          return;
        }
      }
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = inputEl.scrollHeight + 'px';
  });
</script>
</body>
</html>
