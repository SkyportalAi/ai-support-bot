[tool.poetry]
name = "ai-support-bot"
version = "0.1.0"
description = "Simple support agent demo using Ollama (open-source LLM, runs locally)"
authors = ["SkyPortal <sarah@thunderbuddies.ai>"]
readme = "README.md"
packages = [{ include = "agent" }]

[tool.poetry.dependencies]
python = "^3.11"
openai = "^1.30"   # used as Ollama client via OpenAI-compatible API

[tool.poetry.group.dev.dependencies]
ruff = "^0.4"

[tool.poetry.scripts]
support-agent = "agent.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
